<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with dark technical finish -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="32" cy="32" r="20" fill="#3B82F6" fill-opacity="0.15" filter="url(#glow)" />

  <!-- Monogram UA rendered as geometric vectors for crisp rendering at any resolution -->
  <g fill="url(#accentGrad)">
    <!-- Letter U -->
    <path d="M17 19h5.5v16.5c0 3.2 2 5 5 5s5-1.8 5-5V19H38v16.5c0 6.6-4.5 10.5-10.5 10.5S17 42.1 17 35.5V19z" />
    <!-- Letter A -->
    <path d="M37 45.5L44.5 19H50l7.5 26.5h-5.8l-1.6-6.2h-7.6l-1.6 6.2H37zm7.5-11h5.8l-2.9-10.5-2.9 10.5z" />
  </g>
  
  <!-- Electric Blue Dot Accent -->
  <circle cx="53" cy="15" r="3.5" fill="#38BDF8" filter="url(#glow)" />
</svg>
